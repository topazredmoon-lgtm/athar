<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1714"/>
      <stop offset="0.55" stop-color="#070C0A"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#2E8B74" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#17594A" stop-opacity="0.12"/>
